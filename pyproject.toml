[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-guard"
version = "1.0.0"
description = "A defensive, non-intrusive web security audit tool that produces Markdown reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Web Guard contributors" }]
keywords = ["security", "audit", "web", "scanner", "markdown"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
web-guard = "web_guard.cli:main"

[project.urls]
Documentation = "https://github.com/your-org/web-guard#documentation"
Source = "https://github.com/your-org/web-guard"
Issues = "https://github.com/your-org/web-guard/issues"

[tool.setuptools]
packages = ["web_guard"]

[tool.setuptools.package-dir]
web_guard = "src"

[tool.setuptools.package-data]
web_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error::DeprecationWarning:web_guard.*"]

[tool.coverage.run]
source = ["web_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
